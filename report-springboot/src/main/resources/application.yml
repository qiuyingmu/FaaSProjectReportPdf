server:
  port: 9001
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    # Session 超时（30 分钟无操作自动过期）
    session:
      timeout: 30m

spring:
  application:
    name: report-springboot
  main:
    banner-mode: console
  mandatory-file-encoding: UTF-8
  task:
    scheduling:
      # @Scheduled 线程池：报表定时任务 + 日志清理任务并行，避免互相排队阻塞
      pool:
        size: 4
      thread-name-prefix: sched-

  # ========================================
  #  默认：H2 嵌入式数据库（文件模式）
  #  零配置、免安装，适合开发和小规模生产
  # ========================================
  datasource:
    url: jdbc:h2:file:./data/report;AUTO_SERVER=TRUE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
      path: /h2-console
  jpa:
    # 关闭 OSIV：本项目为 REST + PDF 生成，无视图渲染，避免渲染阶段持有数据库连接
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# ========================================
#  管理后台配置
# ========================================
report:
  admin:
    username: admin
    password: admin123
  log:
    path: logs/report.log
  enabled: true
  timeout-seconds: 600

# ========================================
#  Actuator 监控
# ========================================
management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # 只暴露 health/info，不暴露 env（防止 DB 密码 / OBS Key / 钉钉凭证泄露）
        include: health,info

# ========================================
#  生产环境（PostgreSQL）
#  spring.profiles.active=production
# ========================================
---
spring:
  config:
    activate:
      on-profile: production

  # PostgreSQL 数据库
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/report}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:report}
    password: ${DB_PASSWORD:report123}
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgres.sql
      continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
        jdbc:
          batch_size: 20

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}

report:
  admin:
    password: ${REPORT_ADMIN_PASSWORD:admin123}
  enabled: true
  # ===== 可配置化拓展开关（默认开启，可被环境变量覆盖）=====
  # use-config-sources: true → 数据源从 form_configs 表读取（管理 UI 可增删改）
  # use-config-app: true     → 应用凭证从 app_configs 表读取（无配置时回退 .env）
  use-config-sources: ${REPORT_USE_CONFIG_SOURCES:true}
  use-config-app: ${REPORT_USE_CONFIG_APP:true}

# ========================================
#  开发环境（H2 Console 调试用）
#  spring.profiles.active=dev
# ========================================
---
spring:
  config:
    activate:
      on-profile: dev

  h2:
    console:
      enabled: true
      path: /h2-console
