# ============================================================
#  realtimevideo.jgjl.cn  Nginx 配置文件（部署版）
#  用途：替换 /www/server/panel/vhost/nginx/realtimevideo.jgjl.cn.conf
#  ⚠️ 修改前先备份原文件，改完执行：nginx -t && nginx -s reload
#
#  相对你现有配置的唯一改动：
#    /report/api/  proxy_read_timeout / proxy_send_timeout: 60s → 300s
#    （前端 fetch 300s 超时，后端 600s，Nginx 不能成为最短木板）
# ============================================================

server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name realtimevideo.jgjl.cn;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/realtimevideo.jgjl.cn;
    include /www/server/panel/vhost/nginx/extension/realtimevideo.jgjl.cn/*.conf;
    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/realtimevideo.jgjl.cn.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/realtimevideo.jgjl.cn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/realtimevideo.jgjl.cn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/html_realtimevideo.jgjl.cn.conf;
    #REWRITE-END

    # ──────── 禁止访问敏感文件 ────────
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    { return 404; }

    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    # ──────── SSL 验证 ────────
    location ~ \.well-known{ allow all; }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) { return 403; }

    # ══════════ RealTimeVideo（视频监控）══════════
    # 必须放在 / 上面，防止被 SPA 路由抢走

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /ezuikit_cdn/ {
        rewrite ^/ezuikit_cdn/(.*)$ /ezuikit_js/v9.0.5/ezuikit_static/$1 break;
        proxy_pass https://openstatic.ys7.com;
        proxy_set_header Host openstatic.ys7.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # ══════════ 报告系统（子路径 /report）══════════
    # ^~ 防止被下方的 regex 缓存规则抢走匹配

    location ^~ /report/ {
        root /www/wwwroot/realtimevideo.jgjl.cn;
        try_files $uri $uri/ /report/index.html;
        add_header Access-Control-Allow-Origin '*' always;
    }

    location /report/api/ {
        rewrite ^/report(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # ⬇️⬇️ 关键改动：60s → 300s（报告生成最长约 300s，与前端超时一致）⬇️⬇️
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /report/actuator/ {
        rewrite ^/report(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录/登出 POST → 后端 Spring Security（不再有 GET 页面）
    location /report/admin/ {
        rewrite ^/report(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /report/assets/ {
        root /www/wwwroot/realtimevideo.jgjl.cn;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin '*' always;
    }

    # ══════════ 静态文件缓存 ══════════

    # gzip 压缩（HTML/CSS/JS 传输体积减少 ~70%，首屏加速）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }
    location ~ .*\.(js|css)?$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    # ══════════ SPA 路由（RealTimeVideo 前端）══════════
    # 放在最后，兜底所有未匹配的路径

    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    access_log  /www/wwwlogs/realtimevideo.jgjl.cn.log;
    error_log  /www/wwwlogs/realtimevideo.jgjl.cn.error.log;
}
